<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css">
<style>
  h1 { font-size: 100px; }
  .left { max-width: 640px; }
  .app { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }
  .app img { width: 60px; height: 60px; border-radius: 14px; box-shadow: 0 0 0 1px #D9D8CF; }
  .app strong { font-family: "Newsreader", serif; font-weight: 500; font-size: 32px; letter-spacing: -.01em; display: block; line-height: 1.1; }
  .phone { position: absolute; right: 84px; top: 58px; width: 330px; border-radius: 46px; border: 9px solid #15201B; background: #E8EBEA; display: block; box-shadow: 0 30px 60px rgba(21, 32, 27, .16); }
  .foot { width: 640px; }
</style></head>
<body>
  <img class="phone" src="../../img/deltalab-results.jpg" alt="">
  <div class="pad">
    <img class="logo" src="../../img/facet-logo.svg" alt="">
    <div class="left">
      <div class="app"><img src="../../img/deltalab-icon.png" alt=""><div><strong>DeltaLab</strong><span class="mono">For iPhone</span></div></div>
      <h1>NHLS lab results, <em>faster.</em></h1>
    </div>
    <div class="foot"><span class="mono">Free for five patients a day</span></div>
  </div>
</body></html>
